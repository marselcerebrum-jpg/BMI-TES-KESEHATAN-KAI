name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/festive-meitner-9l80ir]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Situs statis tanpa build step: cukup kumpulkan halamannya sendiri,
      # tanpa README dan berkas workflow.
      - name: Siapkan isi situs
        run: |
          mkdir -p _site
          cp index.html _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
